name: Check Riot collector offline

on:
  push:
    paths:
      - 'riot-project/**'
      - '.github/workflows/riot-collector.yml'
  pull_request:
    paths:
      - 'riot-project/**'
      - '.github/workflows/riot-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r riot-project/requirements.txt
      - run: python -m unittest discover -s riot-project/tests -v
